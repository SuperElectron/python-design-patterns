[project]
name = "python-design-patterns"
version = "0.1.0"
description = "Design patterns in Python: naive, pythonic, and real-world examples, with an MCP server for agents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SuperElectron" }]
requires-python = ">=3.11"
keywords = ["design-patterns", "gang-of-four", "mcp", "python-patterns"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Education",
]
dependencies = [
  "mcp>=2.1.1",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/SuperElectron/python-design-patterns"
Reference = "https://python-patterns.guide/"

[project.scripts]
python-design-patterns-mcp = "design_patterns_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/design_patterns", "src/design_patterns_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "patterns", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "patterns"]

[tool.pytest.ini_options]
testpaths = ["tests", "patterns"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --cov=src --cov=patterns --cov-report=term-missing"

[tool.coverage.report]
skip_empty = true
